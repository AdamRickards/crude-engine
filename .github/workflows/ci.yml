name: offline-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyyaml
      - name: Offline proofs
        run: bash scripts/ci_offline.sh
      - name: Upload status.html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-status
          path: docs/status.html

  # Cycle 0 offline proofs. Blocks merge.
  # check_catalogue.py + check_principles.py. No lab jobs.
  release-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyyaml
      - name: Catalogue + principles
        env:
          REQUIRE_RELEASE_PROOFS: "1"
        run: |
          python3 scripts/check_catalogue.py
          python3 scripts/check_principles.py
