version: 2.8.0
feature: software
description: Software images, boot configuration, and integrity settings
methods:
  get_software:
    type: dict
    defaults:
      allow_unsigned: false
      secure_boot: false
      dev_mode: false
      bootcode: ''
      images: {}
    sub_tables:
      images:
        primary_key: image_name
        field_map:
          name: image_name
          location: image_location
          type: image_type
          major: image_major
          minor: image_minor
          bugfix: image_bugfix
          version: image_version
        defaults:
          name: ''
          location: ''
          type: ''
          major: 0
          minor: 0
          bugfix: 0
          version: ''
  set_software:
    type: upsert
    fields: [allow_unsigned, secure_boot]
attributes:
  allow_unsigned:
    wire: hm2devmgmtswversallowunsigned
    source: devmgmt
  secure_boot:
    wire: hm2devmgmtswsecurebootadminstatus
    source: devmgmt
  dev_mode:
    wire: hm2devmgmtswsecurebootdevmodestatus
    source: devmgmt
  bootcode:
    wire: hm2devmgmtswversbootcode
    source: devmgmt
  image_name:
    wire: hm2devmgmtswfilename
    source: devmgmt
  image_location:
    wire: hm2devmgmtswfilelocation
    source: devmgmt
    value_map:
      '1': ram
      '2': flash
      '3': sd-card
  image_type:
    wire: hm2devmgmtswfiletype
    source: devmgmt
    value_map:
      '1': firmware
      '2': applet
      '3': logic
  image_major:
    wire: hm2devmgmtswmajorrelnum
    source: devmgmt
  image_minor:
    wire: hm2devmgmtswminorrelnum
    source: devmgmt
  image_bugfix:
    wire: hm2devmgmtswbugfixrelnum
    source: devmgmt
  image_version:
    compute:
      from: [image_major, image_minor, image_bugfix]
      expr: "f'{image_major}.{image_minor}.{str(image_bugfix).zfill(2)}'"
