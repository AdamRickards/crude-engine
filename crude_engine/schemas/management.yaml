version: 2.7.0
feature: management
description: Management interface and access configuration
methods:
  get_management:
    type: dict
    defaults:
      ip_address: ''
      prefix_length: 0
      netmask: ''
      gateway: ''
      vlan_id: 1
      protocol: ''
  set_management:
    type: upsert
  get_management_priority:
    type: dict
    # HM2-NETCONFIG-MIB management-reply priorities (wire already in netconfig.yaml).
    # napalm-hios names: dot1p / ip_dscp. Stub source/priority had no attrs → both_absent (#240).
    defaults:
      dot1p: 0
      ip_dscp: 0
  set_management_priority:
    type: upsert
    fields: [dot1p, ip_dscp]
attributes:
  ip_address:
    wire: hm2netlocalipaddr
    source: netconfig
  prefix_length:
    wire: hm2netprefixlength
    source: netconfig
  gateway:
    wire: hm2netgatewayipaddr
    source: netconfig
  vlan_id:
    wire: hm2netvlanid
    source: netconfig
  netmask:
    compute:
      from: [prefix_length]
      expr: "'.'.join([str((0xffffffff << (32 - int(prefix_length)) >> i) & 0xff) for i in [24,16,8,0]]) if prefix_length else ''"
  protocol:
    wire: hm2netconfigprotocol
    source: netconfig
    value_map:
      '1': static
      '2': bootp
      '3': dhcp
  # Management reply priorities (get/set_management_priority)
  dot1p:
    wire: hm2netvlanpriority
    source: netconfig
  ip_dscp:
    wire: hm2netipdscppriority
    source: netconfig
