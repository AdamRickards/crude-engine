version: 2.9.0
feature: arp
description: ARP table and Dynamic ARP Inspection (DAI) configuration
methods:
  get_arp_table:
    type: dict
    primary_key: ip
    # IP-MIB ipNetToMediaTable (1.17 same-wire). Not ipNetToPhysical*.
    # Accessible Media columns; SNMP suffix is ifIndex.ip.
    defaults:
      interface: ''
      mac: ''
      ip: ''
      age: 0.0
  get_arp_inspection:
    type: dict
    defaults:
      validate_src_mac: false
      validate_dst_mac: false
      validate_ip: false
      auto_disable: false
      ports: {}
      vlans: {}
    # Fanout=3: global + vlan + interfaces (#315 Rank1 / archive + 1.17).
    # NOT show port (was empty-vlans / invent-default ports). No per-VLAN show fanout.
    # key_map ifindex (MOPS); SSH table keys port-name — key-shape remainder honest.
    # Top-level auto_disable: arp-rate reason bool (devmgmt; Rank1v2 compute shape).
    # Port auto_disable is DAI if (interfaces col; dai_on_ssh).
    sub_tables:
      ports:
        primary_key: dai_trusted
        key_map: ifindex
        field_map:
          trusted: dai_trusted
          rate_limit: dai_rate_limit
          burst_interval: dai_burst_interval
          auto_disable: dai_port_auto_disable
        defaults:
          trusted: false
          rate_limit: -1
          burst_interval: 1
          auto_disable: true
      vlans:
        primary_key: dai_vlan_index
        field_map:
          enabled: dai_vlan_enabled
          logging: dai_vlan_logging
          binding_check: dai_vlan_binding_check
          acl_static: dai_vlan_acl_static
          acl_name: dai_vlan_acl_name
        defaults:
          enabled: false
          logging: false
          binding_check: false
          acl_static: false
          acl_name: ''
  set_arp_inspection:
    type: upsert
    fields: [validate_src_mac, validate_dst_mac, validate_ip]
  set_arp_inspection_port:
    type: upsert
    fields: [dai_trusted, dai_rate_limit, dai_burst_interval, dai_port_auto_disable]
  set_arp_inspection_vlan:
    type: upsert
    fields: [dai_vlan_enabled, dai_vlan_logging, dai_vlan_binding_check, dai_vlan_acl_static, dai_vlan_acl_name]
attributes:
  # ARP table (get_arp_table) — ipNetToMediaTable, not Physical.
  # Media has no lastUpdated; age stays default 0.0 (1.17 same).
  interface:
    wire: ipnettomediaifindex
    source: ip
    # MOPS/SNMP ifIndex → ifName (sflow/mrp sibling); SSH ifName misses pass through (#295).
    value_map: ifindex
  mac:
    wire: ipnettomediaphysaddress
    source: ip
  ip:
    wire: ipnettomedianetaddress
    source: ip
  age: {}
  # DAI global
  validate_src_mac:
    wire: hm2agentdaisrcmacvalidate
    source: platform-switching
    value_map:
      '1': true
      '2': false
      enabled: true
      disabled: false
  validate_dst_mac:
    wire: hm2agentdaidstmacvalidate
    source: platform-switching
    value_map:
      '1': true
      '2': false
      enabled: true
      disabled: false
  validate_ip:
    wire: hm2agentdaiipvalidate
    source: platform-switching
    value_map:
      '1': true
      '2': false
      enabled: true
      disabled: false
  # Raw arp-rate reason op. index_filter → scalar (MOPS/SNMP); SSH returns full dict
  # (driver ignores _index_filter). Not in defaults — hidden from output.
  auto_disable_reason_arp:
    wire: hm2autodisablereasonoperation
    source: devmgmt
    index_filter: arp-rate
    value_map:
      '5': arp-rate
      '1': true
      '2': false
      enabled: true
      disabled: false
  # Shape to bool: pass MOPS/SNMP scalar; SSH dict → arp-rate (or SNMP key '5').
  # collect:{key:arp-rate} alone would None-out scalars after index_filter.
  auto_disable:
    compute:
      from: [auto_disable_reason_arp]
      expr: "auto_disable_reason_arp if str(auto_disable_reason_arp) in ('True', 'False') else auto_disable_reason_arp.get('arp-rate', auto_disable_reason_arp.get('5', False))"
  # DAI per-port
  port_ifindex:
    wire: ifname
    source: if
  dai_trusted:
    wire: hm2agentdaiiftrustenable
    source: platform-switching
    value_map:
      '1': true
      '2': false
      'yes': true
      'no': false
      enabled: true
      disabled: false
  dai_rate_limit:
    wire: hm2agentdaiifratelimit
    source: platform-switching
    value_map:
      '-': -1
  dai_burst_interval:
    wire: hm2agentdaiifburstinterval
    source: platform-switching
    value_map:
      '-': 1
  dai_port_auto_disable:
    wire: hm2agentdaiifautodisable
    source: platform-switching
    value_map:
      '1': true
      '2': false
      'yes': true
      'no': false
      enabled: true
      disabled: false
  # DAI per-VLAN
  dai_vlan_index:
    wire: hm2agentdaivlanindex
    source: platform-switching
  dai_vlan_enabled:
    wire: hm2agentdaivlandynarpinspenable
    source: platform-switching
    value_map:
      '1': true
      '2': false
      'yes': true
      'no': false
      enabled: true
      disabled: false
  dai_vlan_logging:
    wire: hm2agentdaivlanloggingenable
    source: platform-switching
    value_map:
      '1': true
      '2': false
      'yes': true
      'no': false
      enabled: true
      disabled: false
  dai_vlan_binding_check:
    wire: hm2agentdaivlanbindingcheckenable
    source: platform-switching
    value_map:
      '1': true
      '2': false
      'yes': true
      'no': false
      enabled: true
      disabled: false
  dai_vlan_acl_static:
    wire: hm2agentdaivlanarpaclstaticflag
    source: platform-switching
    value_map:
      '1': true
      '2': false
      'yes': true
      'no': false
      enabled: true
      disabled: false
  dai_vlan_acl_name:
    wire: hm2agentdaivlanarpaclname
    source: platform-switching
