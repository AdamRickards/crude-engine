version: 2.7.0
feature: protection
description: 'Network protection features: Storm Control, Loop Protection, and Auto-Disable'
methods:
  get_storm_control:
    type: dict
    primary_key: broadcast_enabled
    key_map: ifindex
    defaults:
      broadcast_enabled: false
      broadcast_threshold: 0
      multicast_enabled: false
      multicast_threshold: 0
  set_storm_control:
    type: upsert
  get_loop_protection:
    type: dict
    defaults:
      enabled: false
      transmission_interval: 2
      rx_threshold: 0
      interfaces: {}
    attributes:
      enabled:
        wire: hm2agentswitchkeepalivestate
        source: platform-switching
        # MOPS/SNMP enum 1/2 → bool (lp_port_enabled / loop_enabled sibling); SSH bool passes (#299).
        value_map:
          '1': true
          '2': false
      transmission_interval:
        wire: hm2agentswitchkeepalivetransmitinterval
        source: platform-switching
      rx_threshold:
        wire: hm2agentswitchkeepaliverxthreshold
        source: platform-switching
    # Fanout=2: global scalars + interface table (#299 Rank1 / archive + 1.17).
    # key_map ifindex (MOPS); SSH table keys port-name — key-shape remainder honest.
    sub_tables:
      interfaces:
        primary_key: lp_port_enabled
        key_map: ifindex
        field_map:
          enabled: lp_port_enabled
          mode: lp_port_mode
          action: lp_port_action
          vlan_id: lp_port_vlan_id
          loop_detected: lp_port_loop_detected
          last_loop_time: lp_port_last_loop_time
        defaults:
          enabled: false
          mode: passive
          action: auto-disable
          vlan_id: 0
          loop_detected: false
          last_loop_time: ''
  set_loop_protection:
    type: upsert
  get_auto_disable:
    type: dict
    # Wired primary + key_map (storm_control sibling). name: {} → empty pk → Offline {} (#244)
    primary_key: enabled
    key_map: ifindex
    defaults:
      enabled: false
      reason: none
      remaining_time: 0
      timer: 0
    attributes:
      enabled:
        wire: hm2autodisableintfoperstate
        source: devmgmt
        value_map:
          '1': true
          '2': false
      reason:
        wire: hm2autodisableintferrorreason
        source: devmgmt
        value_map:
          '0': none
          '1': link-flap
          '2': crc-error
          '3': duplex-mismatch
          '4': dhcp-snooping
          '5': arp-rate
          '6': bpdu-rate
          '7': mac-based-port-security
          '8': overload-detection
          '9': speed-duplex
          '10': loop-protection
      remaining_time:
        wire: hm2autodisableintfremainingtime
        source: devmgmt
      timer:
        wire: hm2autodisableintftimer
        source: devmgmt
  set_auto_disable:
    type: upsert
    index_filter: '^\d+/\d+$'
  get_auto_disable_reasons:
    type: dict
    primary_key: reason
    # INDEX hm2AutoDisableReasons is not-accessible. Drive from accessible
    # ReasonOperation; suffix is the reason enum.
    index_fields: [reason]
    defaults:
      enabled: false
      category: ''
    attributes:
      reason:
        wire: hm2autodisablereasonoperation
        source: devmgmt
        value_map:
          '1': link-flap
          '2': crc-error
          '3': duplex-mismatch
          '4': dhcp-snooping
          '5': arp-rate
          '6': bpdu-rate
          '7': mac-based-port-security
          '8': overload-detection
          '9': speed-duplex
          '10': loop-protection
      enabled:
        wire: hm2autodisablereasonoperation
        source: devmgmt
      category:
        wire: hm2autodisablereasoncategory
        source: devmgmt
        value_map:
          '1': other
          '2': port-monitor
          '3': network-security
          '4': l2-redundancy
  set_auto_disable_reason:
    type: upsert
    index_key: auto_disable_reason
    attributes:
      enabled:
        wire: hm2autodisablereasonoperation
        source: devmgmt
  auto_disable_reset:
    type: upsert
    fields: [auto_disable_reset]
    index_filter: '^\d+/\d+$'
attributes:
  broadcast_enabled:
    wire: hm2trafficmgmtifingressstormctlbcastmode
    source: trafficmgmt
  broadcast_threshold:
    wire: hm2trafficmgmtifingressstormctlbcastthreshold
    source: trafficmgmt
  multicast_enabled:
    wire: hm2trafficmgmtifingressstormctlmcastmode
    source: trafficmgmt
  multicast_threshold:
    wire: hm2trafficmgmtifingressstormctlmcastthreshold
    source: trafficmgmt
  # get_loop_protection.interfaces (#299 Rank1) — keepalive port wires.
  lp_port_enabled:
    wire: hm2agentkeepaliveportstate
    source: platform-switching
    value_map:
      '1': true
      '2': false
      enabled: true
      disabled: false
  lp_port_mode:
    wire: hm2agentkeepaliveportmode
    source: platform-switching
    value_map:
      '1': active
      '2': passive
      active: active
      passive: passive
  lp_port_action:
    wire: hm2agentkeepaliveportrxaction
    source: platform-switching
    value_map:
      '10': trap
      '11': auto-disable
      '12': all
      trap: trap
      auto-disable: auto-disable
      all: all
  lp_port_vlan_id:
    wire: hm2agentkeepaliveportvlanid
    source: platform-switching
  lp_port_loop_detected:
    wire: hm2agentkeepaliveportloopdetected
    source: platform-switching
    value_map:
      '1': true
      '2': false
      'yes': true
      'no': false
  lp_port_last_loop_time:
    wire: hm2agentkeepaliveportlastloopdetectedtime
    source: platform-switching
  loop_enabled:
    wire: hm2agentswitchkeepalivestate
    source: platform-switching
    value_map:
      '1': enabled
      '2': disabled
  loop_interval:
    wire: hm2agentswitchkeepalivetransmitinterval
    source: platform-switching
  auto_disable_reason:
    wire: hm2autodisableintferrorreason
    source: devmgmt
    value_map:
      '0': none
      '1': link-flap
      '2': crc-error
      '3': duplex-mismatch
      '4': dhcp-snooping
      '5': arp-rate
      '6': bpdu-rate
      '7': mac-based-port-security
      '8': overload-detection
      '9': speed-duplex
      '10': loop-protection
  auto_disable_timer:
    wire: hm2autodisableintftimer
    source: devmgmt
  auto_disable_reset:
    wire: hm2autodisableintfreset
    source: devmgmt
