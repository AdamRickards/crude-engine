version: 2.7.0
feature: qos_mapping
description: Global dot1p and DSCP to traffic class mapping tables
methods:
  get_qos_mapping:
    type: dict
    defaults:
      dot1p: {}
      dscp: {}
    sub_tables:
      # Drive rows from the accessible value column. SNMP walk suffix is the
      # INDEX (hm2TrafficClassPriority 0..7 / hm2CosMapIpDscpValue 0..63).
      # Do not walk the not-accessible INDEX objects (1.17 same-wire).
      dot1p:
        primary_key: dot1p_traffic_class
        field_map:
          value: dot1p_traffic_class
      dscp:
        primary_key: dscp_traffic_class
        field_map:
          value: dscp_traffic_class
  set_qos_mapping:
    type: upsert
attributes:
  dot1p_priority:
    wire: hm2trafficclasspriority
    source: l2forwarding
  dot1p_traffic_class:
    wire: hm2trafficclass
    source: l2forwarding
  dscp_value:
    wire: hm2cosmapipdscpvalue
    source: l2forwarding
  dscp_traffic_class:
    wire: hm2cosmapipdscptrafficclass
    source: l2forwarding
