version: 2.7.0
feature: optics
description: SFP Transceiver digital diagnostics (DDM)
methods:
  get_optics:
    type: dict
    primary_key: name
    key_map: ifindex
    index_filter: '^\d+/\d+$'
    defaults:
      tx_power: 0.0
      rx_power: 0.0
      temperature: 0.0
attributes:
  # Identity is detected-SFP ifIndex from hm2SfpDiagEntry (MIB: "Entry for
  # a detected SFP"), not if.ifname (full ifTable). Drive rows from an
  # accessible walked column — same pattern as get_users / trap dests.
  # Do NOT use scalar hm2sfpdiagtable + lookup resolve:"key": SNMP/MOPS
  # GET of the table OID returns {} (dict), so _apply_lookup takes the
  # dict-match branch and yields n=0; SSH parser:none returns a string
  # and the non-dict branch works (HITL on #76 tip). key_map remaps
  # ifIndex → ifName. Defaults 0.0 cannot manufacture cpu/vlan/empty-cage
  # rows because they are not in hm2SfpDiagEntry.
  # Power unit: dBm (1.17 / #294). Integer32 hm2SfpCurrent{Tx,Rx}Power is
  # 0.1 µW — do not bind SSH show-sfp dBm floats onto those wires.
  # Sibling DisplayString columns …PowerdBm (OID …7.2.1.5/.6) are the dBm
  # semantic; SSH overlay + MOPS/SNMP share one unit.
  name:
    wire: hm2sfpcurrenttxpowerdbm
    source: devmgmt
  tx_power:
    wire: hm2sfpcurrenttxpowerdbm
    source: devmgmt
  rx_power:
    wire: hm2sfpcurrentrxpowerdbm
    source: devmgmt
  temperature:
    wire: hm2sfpcurrenttemperature
    source: devmgmt
