version: 2.7.0
feature: config
description: Configuration management and watchdog status
methods:
  get_config:
    type: dict
    defaults:
      running: ''
      startup: ''
  get_config_status:
    type: dict
    defaults:
      saved: true
      nvm: ok
      aca: absent
      boot: ok
  get_config_remote:
    type: dict
    defaults:
      url: ''
      status: idle
    attributes:
      url:
        wire: hm2fmconfigremotesavedestination
        source: filemgmt
      status:
        wire: hm2fmconfigremotesaveadminstatus
        source: filemgmt
  set_config_remote:
    type: upsert
  get_watchdog_status:
    type: dict
    defaults:
      watchdog_enabled: false
      watchdog_interval: 0
      watchdog_remaining: 0
  set_watchdog:
    type: upsert
attributes:
  # #324: running wired to SSH "show running-config script" (raw text,
  # parser: none). SSH-only; MOPS/SNMP stay empty.
  running:
    wire: hm2configrunning
    source: config
  # startup stays unwired, deliberately: "show startup-config" is rejected as
  # an invalid command on the tested firmware, and the saved (nvm) config can
  # only be read by first loading it into running (a mutating copy), which a
  # read-only getter must not do. Not a wiring gap; there is nothing to wire.
  startup: {}
  nvm:
    wire: hm2fmnvmstate
    source: filemgmt
    value_map:
      '1': ok
      '2': outOfSync
      '3': busy
  aca:
    wire: hm2fmenvmstate
    source: filemgmt
    value_map:
      '1': ok
      '2': outOfSync
      '3': absent
  boot:
    wire: hm2fmbootparamstate
    source: filemgmt
    value_map:
      '1': ok
      '2': outOfSync
  saved:
    compute:
      from: [nvm]
      expr: "nvm == 'ok'"
  watchdog_enabled:
    wire: hm2configwatchdogadminstatus
    source: filemgmt
  watchdog_interval:
    wire: hm2configwatchdogtimeinterval
    source: filemgmt
  watchdog_remaining:
    wire: hm2configwatchdogtimervalue
    source: filemgmt
