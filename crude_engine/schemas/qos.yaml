version: 2.7.0
feature: qos
description: Quality of Service (QoS) and Traffic Class mapping
methods:
  get_qos:
    type: dict
    defaults:
      global_trust_mode: none
      port_trust_mode: {}
  set_qos:
    type: upsert
attributes:
  num_traffic_classes:
    wire: dot1dportnumtrafficclasses
    source: p-bridge
  default_priority:
    wire: dot1dportdefaultuserpriority
    source: p-bridge
  port_trust_mode:
    wire: hm2agentcosmapintftrustmode
    source: platform-qos-cos
  port_untrusted_tc:
    wire: hm2agentcosmapuntrustedtrafficclass
    source: platform-qos-cos
