version: 2.7.0
feature: poe
description: Power over Ethernet (PoE) status and configuration
methods:
  get_poe:
    type: dict
    # Wired primary + key_map ifindex (storm_control / #244). bare name pk → Offline {} (#245)
    primary_key: enabled
    key_map: ifindex
    defaults:
      enabled: false
      power_limit: 0.0
      status: searching
  set_poe:
    type: upsert
attributes:
  enabled:
    wire: hm2poemgmtportadminenable
    source: poe
  power_limit:
    wire: hm2poemgmtportpowerlimit
    source: poe
  status:
    wire: hm2poemgmtportdetectionstatus
    source: poe
