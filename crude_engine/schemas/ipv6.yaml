version: 2.7.0
feature: ipv6
description: IPv6 configuration and neighbor discovery
methods:
  get_ipv6_neighbors:
    type: dict
    primary_key: ip
    # Same table as get_ipv6_neighbors_table and ARP family (#75):
    # ipNetToMediaTable, not Physical INDEX (1.17 has no ND getter).
    defaults:
      interface: ''
      ip: ''
      mac: ''
      state: reachable
  get_ipv6_neighbors_table:
    type: dict
    primary_key: ip
    defaults:
      interface: ''
      ip: ''
      mac: ''
      state: reachable
attributes:
  ipv6_address:
    wire: hm2netipv6localaddr
    source: netconfig
  ipv6_state:
    wire: hm2netipv6adminstatus
    source: netconfig
  # ipNetToMediaTable (accessible columns; suffix ifIndex.ip).
  # Physical 4.35 is empty on SNMP. Media has no ND state; default reachable.
  interface:
    wire: ipnettomediaifindex
    source: ip
  ip:
    wire: ipnettomedianetaddress
    source: ip
  mac:
    wire: ipnettomediaphysaddress
    source: ip
  state: {}
