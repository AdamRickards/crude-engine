    type: boolean
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.248.11.40.1.3.1.1.1.1
          method: get
      mops:
        read:
          mib: HM2-LINK-BACKUP-MIB
          table: hm2LinkBackupGeneralGroup
          field: hm2LinkBackupAdminStatus
    validation:
      allowed:
      - true
      - false
  hm2linkbackupbackupinterface:
