    type: integer
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.248.11.40.1.3.1.1.2.1.1.2
          method: walk
      mops:
        read:
          mib: HM2-LINK-BACKUP-MIB
          table: hm2LinkBackupInterfaceConfigEntry
          field: hm2LinkBackupBackupInterface
          index_field: hm2LinkBackupBackupInterface
          index_fields: &id001
