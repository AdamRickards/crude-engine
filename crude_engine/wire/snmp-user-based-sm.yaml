      usmuserspinlock: ''
      usmuserstatus: 0
      usmuserstoragetype: 0
      usmusertable: ''
attributes:
  usmstatsdecryptionerrors:
    syntax: Counter32
    type: integer
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.6.3.15.1.1.6
          method: get
      mops:
        read:
          mib: SNMP-USER-BASED-SM-MIB
          table: usmStats
          field: usmStatsDecryptionErrors
  usmstatsnotintimewindows:
