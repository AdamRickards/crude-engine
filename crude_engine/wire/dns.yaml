attributes:
  hm2dnscacheadminstate:
    syntax: HmEnabledStatus
    type: boolean
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.248.11.90.1.2.1
          method: get
      mops:
        read:
          mib: HM2-DNS-MIB
          table: hm2DnsCacheGroup
          field: hm2DnsCacheAdminState
    validation:
      allowed:
      - true
      - false
  hm2dnscacheflushaction:
    syntax: HmActionValue
    type: string
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.248.11.90.1.2.2
          method: get
      mops:
        read:
