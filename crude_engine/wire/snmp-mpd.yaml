version: 2.6.0
feature: snmp-mpd
schemas:
  read_snmp-mpd:
    type: dict
    defaults:
      snmpinvalidmsgs: 0
      snmpunknownpduhandlers: 0
      snmpunknownsecuritymodels: 0
attributes:
  snmpinvalidmsgs:
    syntax: Counter32
    type: integer
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.6.3.11.2.1.2
          method: get
      mops:
        read:
          mib: SNMP-MPD-MIB
          table: snmpMPDStats
          field: snmpInvalidMsgs
  snmpunknownpduhandlers:
    syntax: Counter32
    type: integer
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.6.3.11.2.1.3
          method: get
      mops:
        read:
          mib: SNMP-MPD-MIB
          table: snmpMPDStats
          field: snmpUnknownPDUHandlers
  snmpunknownsecuritymodels:
    syntax: Counter32
    type: integer
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.6.3.11.2.1.1
          method: get
      mops:
        read:
          mib: SNMP-MPD-MIB
          table: snmpMPDStats
          field: snmpUnknownSecurityModels
