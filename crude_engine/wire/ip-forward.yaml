      ipforwardtable: ''
      ipforwardtype: 0
attributes:
  inetcidrrouteage:
    syntax: Gauge32
    type: integer
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.2.1.4.24.7.1.10
          method: walk
      mops:
        read:
          mib: IP-FORWARD-MIB
          table: inetCidrRouteEntry
          field: inetCidrRouteAge
          index_field: inetCidrRouteNextHop
          index_fields: &id001
          - inetCidrRouteDestType
          - inetCidrRouteDest
          - inetCidrRoutePfxLen
          - inetCidrRoutePolicy
          - inetCidrRouteNextHopType
          - inetCidrRouteNextHop
  inetcidrroutedest:
    syntax: InetAddress
    type: string
    access: r
    sources:
      snmp:
        read:
          # Accessible inetCidrRouteIfIndex. INDEX inetCidrRouteDest
          # (1.3.6.1.2.1.4.24.7.1.2) is not-accessible. Suffix is RFC 4292
          # destType.dest.pfxLen.policy.nextHopType.nextHop; dest/nextHop
          # are length-prefixed InetAddress. IPv4 only (dest_type 1).
          oid: 1.3.6.1.2.1.4.24.7.1.7
          method: walk
          index_fields:
            - name: dest_type
              type: integer
            - name: destination
              type: octet_string
            - name: pfx_len
              type: integer
            - name: policy
              type: octet_string
            - name: nexthop_type
              type: integer
            - name: next_hop
              type: octet_string
          value_from_index: destination
          value_format: ipv4
          index_filter:
            dest_type: 1
      mops:
        read:
          mib: IP-FORWARD-MIB
          table: inetCidrRouteEntry
          field: inetCidrRouteDest
          index_field: inetCidrRouteNextHop
          index_fields: *id001
  inetcidrroutedesttype:
    syntax: InetAddressType
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.2.1.4.24.7.1.1
          method: walk
      mops:
        read:
          mib: IP-FORWARD-MIB
          table: inetCidrRouteEntry
          field: inetCidrRouteDestType
          index_field: inetCidrRouteNextHop
          index_fields: *id001
  inetcidrroutediscards:
    syntax: Counter32
    type: integer
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.2.1.4.24.8
          method: get
      mops:
        read:
          mib: IP-FORWARD-MIB
          table: ipForward
          field: inetCidrRouteDiscards
  inetcidrrouteentry:
    syntax: InetCidrRouteEntry
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.2.1.4.24.7.1
          method: get
