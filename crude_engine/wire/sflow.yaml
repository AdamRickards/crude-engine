version: 2.6.0
feature: sflow
schemas:
  read_sflow:
    type: dict
    defaults:
      sflowagentaddress: ''
      sflowagentaddresstype: ''
      sflowcpdatasource: ''
      sflowcpentry: ''
      sflowcpinstance: ''
      sflowcpinterval: 0
      sflowcpreceiver: ''
      sflowcptable: ''
      sflowfsdatasource: ''
      sflowfsentry: ''
      sflowfsinstance: ''
      sflowfsmaximumheadersize: 0
      sflowfspacketsamplingrate: 0
      sflowfsreceiver: ''
      sflowfstable: ''
      sflowrcvraddress: ''
      sflowrcvraddresstype: ''
      sflowrcvrdatagramversion: 0
      sflowrcvrentry: ''
      sflowrcvrindex: 0
      sflowrcvrmaximumdatagramsize: 0
      sflowrcvrowner: ''
      sflowrcvrport: 0
      sflowrcvrtable: ''
      sflowrcvrtimeout: 0
      sflowversion: ''
attributes:
  sflowagentaddress:
    syntax: InetAddress
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.3
          method: get
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowAgent
          field: sFlowAgentAddress
  sflowagentaddresstype:
    syntax: InetAddressType
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.2
          method: get
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowAgent
          field: sFlowAgentAddressType
  sflowcpdatasource:
    syntax: SFlowDataSource
    type: string
    access: r
    sources:
      snmp:
        read:
          # Accessible sFlowCpReceiver. INDEX DataSource is not-accessible.
          # Suffix is {oid_len}.1.3.6.1.2.1.2.2.1.1.{ifIndex}.{instance}.
          oid: 1.3.6.1.4.1.14706.1.1.6.1.3
          method: walk
          key_tag: crude_text
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowCpEntry
          field: sFlowCpDataSource
          index_field: sFlowCpDataSource
          index_fields: &id001
          - sFlowCpDataSource
          - sFlowCpInstance
  sflowcpentry:
    syntax: SFlowCpEntry
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.6.1
          method: get
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowCpTable
          field: sFlowCpEntry
  sflowcpinstance:
    syntax: SFlowInstance
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.6.1.2
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowCpEntry
          field: sFlowCpInstance
          index_field: sFlowCpDataSource
          index_fields: *id001
  sflowcpinterval:
    syntax: Integer32
    type: integer
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.6.1.4
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowCpEntry
          field: sFlowCpInterval
          index_field: sFlowCpDataSource
          index_fields: *id001
  sflowcpreceiver:
    syntax: SFlowReceiver
    type: integer
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.6.1.3
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowCpEntry
          field: sFlowCpReceiver
          index_field: sFlowCpDataSource
          index_fields: *id001
  sflowcptable:
    syntax: SFlowCpEntry
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.6
          method: get
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowAgent
          field: sFlowCpTable
  sflowfsdatasource:
    syntax: SFlowDataSource
    type: string
    access: r
    sources:
      snmp:
        read:
          # Accessible sFlowFsReceiver. INDEX DataSource is not-accessible.
          # Suffix is {oid_len}.1.3.6.1.2.1.2.2.1.1.{ifIndex}.{instance}.
          oid: 1.3.6.1.4.1.14706.1.1.5.1.3
          method: walk
          key_tag: crude_text
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowFsEntry
          field: sFlowFsDataSource
          index_field: sFlowFsDataSource
          index_fields: &id002
          - sFlowFsDataSource
          - sFlowFsInstance
  sflowfsentry:
    syntax: SFlowFsEntry
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.5.1
          method: get
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowFsTable
          field: sFlowFsEntry
  sflowfsinstance:
    syntax: SFlowInstance
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.5.1.2
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowFsEntry
          field: sFlowFsInstance
          index_field: sFlowFsDataSource
          index_fields: *id002
  sflowfsmaximumheadersize:
    syntax: Integer32
    type: integer
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.5.1.5
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowFsEntry
          field: sFlowFsMaximumHeaderSize
          index_field: sFlowFsDataSource
          index_fields: *id002
  sflowfspacketsamplingrate:
    syntax: Integer32
    type: integer
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.5.1.4
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowFsEntry
          field: sFlowFsPacketSamplingRate
          index_field: sFlowFsDataSource
          index_fields: *id002
  sflowfsreceiver:
    syntax: SFlowReceiver
    type: integer
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.5.1.3
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowFsEntry
          field: sFlowFsReceiver
          index_field: sFlowFsDataSource
          index_fields: *id002
  sflowfstable:
    syntax: SFlowFsEntry
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.5
          method: get
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowAgent
          field: sFlowFsTable
  sflowrcvraddress:
    syntax: InetAddress
    type: string
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.4.1.6
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowRcvrEntry
          field: sFlowRcvrAddress
          index_field: sFlowRcvrIndex
  sflowrcvraddresstype:
    syntax: InetAddressType
    type: string
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.4.1.5
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowRcvrEntry
          field: sFlowRcvrAddressType
          index_field: sFlowRcvrIndex
  sflowrcvrdatagramversion:
    syntax: Integer32
    type: integer
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.4.1.8
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowRcvrEntry
          field: sFlowRcvrDatagramVersion
          index_field: sFlowRcvrIndex
  sflowrcvrentry:
    syntax: SFlowRcvrEntry
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.4.1
          method: get
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowRcvrTable
          field: sFlowRcvrEntry
  sflowrcvrindex:
    syntax: Integer32
    type: integer
    access: r
    sources:
      snmp:
        read:
          # Accessible sFlowRcvrOwner. INDEX sFlowRcvrIndex is
          # not-accessible; 1.17 never walks it. Suffix is 1-8.
          oid: 1.3.6.1.4.1.14706.1.1.4.1.2
          method: walk
          index_fields:
            - name: receiver_index
              type: integer
          key_field: receiver_index
          value_from_index: receiver_index
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowRcvrEntry
          field: sFlowRcvrIndex
          index_field: sFlowRcvrIndex
    validation:
      min: 1
      max: 65535
  sflowrcvrmaximumdatagramsize:
    syntax: Integer32
    type: integer
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.4.1.4
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowRcvrEntry
          field: sFlowRcvrMaximumDatagramSize
          index_field: sFlowRcvrIndex
  sflowrcvrowner:
    syntax: OwnerString
    type: string
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.4.1.2
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowRcvrEntry
          field: sFlowRcvrOwner
          index_field: sFlowRcvrIndex
  sflowrcvrport:
    syntax: Integer32
    type: integer
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.4.1.7
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowRcvrEntry
          field: sFlowRcvrPort
          index_field: sFlowRcvrIndex
  sflowrcvrtable:
    syntax: SFlowRcvrEntry
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.4
          method: get
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowAgent
          field: sFlowRcvrTable
  sflowrcvrtimeout:
    syntax: Integer32
    type: integer
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.4.1.3
          method: walk
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowRcvrEntry
          field: sFlowRcvrTimeout
          index_field: sFlowRcvrIndex
    validation:
      min: -1
      max: 2147483647
  sflowversion:
    syntax: SnmpAdminString
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.14706.1.1.1
          method: get
      mops:
        read:
          mib: SFLOW-MIB
          table: sFlowAgent
          field: sFlowVersion
