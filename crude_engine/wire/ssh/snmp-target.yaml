version: "2.6.0"
feature: snmp-target-ssh
description: "SSH CLI sources for SNMP trap destinations — hand-authored"

attributes:
  # get_snmp_trap_destinations (#319 Rank1): show snmp trap section 1 table.
  # Col0 = SNMP trap name, col1 = IP address (ip:port). Fanout=1 (same show).
  # Without key_column, table keys are row_num "0" → implied_string decode
  # chr(0) = NUL key/address vs MOPS name. Prefer existing key_column tool.
  # No invent floors. No per-dest fanout (#290/#303 HARD). Do not reopen #92.
  snmptargetaddrtaddress:
    sources:
      ssh:
        read: {command: "show snmp trap", parser: table, section: 1, key_column: 0, column: 1}

  snmptargetaddrname:
    sources:
      ssh:
        read: {command: "show snmp trap", parser: table, section: 1, key_column: 0, column: 0}

  snmptargetaddrrowstatus:
    sources:
      ssh:
        create: {command: "snmp notification host add {name} {address}:{port} user {security_name} {security_level}", level: config}
        delete: {command: "snmp notification host delete {index}", level: config}

  snmptargetparamsrowstatus:
    sources:
      ssh:
        create: {command: "snmp notification host add {name} {address}:{port} user {security_name} {security_level}", level: config}
        delete: {command: "snmp notification host delete {index}", level: config}
