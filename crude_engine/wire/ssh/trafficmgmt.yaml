version: "2.9.0"
feature: trafficmgmt-ssh
description: "SSH CLI sources for traffic management (storm control, flow control)"

attributes:
  hm2trafficmgmtifingressstormctlbcastmode:
    type: string
    sources:
      ssh:
        read: {command: "show storm-control ingress", parser: table, column: 1}

  hm2trafficmgmtifingressstormctlbcastthreshold:
    type: string
    sources:
      ssh:
        read: {command: "show storm-control ingress", parser: table, column: 2}

  hm2trafficmgmtifingressstormctlmcastmode:
    type: string
    sources:
      ssh:
        read: {command: "show storm-control ingress", parser: table, column: 3}

  hm2trafficmgmtifingressstormctlmcastthreshold:
    type: string
    sources:
      ssh:
        read: {command: "show storm-control ingress", parser: table, column: 4}

  # Flow control (interface write)
  hm2trafficmgmtifflowcontrol:
    sources:
      ssh:
        write: {command: "storm-control flow-control", level: config_interface}
