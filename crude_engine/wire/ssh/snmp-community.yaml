version: "2.6.0"
feature: snmp-community-ssh
description: "SSH CLI sources for SNMP communities — hand-authored"

attributes:
  snmpcommunityname:
    sources:
      ssh:
        read: {command: "show snmp community", parser: simple_table, column: 0}
        create: {command: "snmp community ro {community_name}", level: config}
        delete: {command: "no snmp community ro {index}", level: config}

  snmpcommunitystatus:
    sources:
      ssh:
        create: {command: "snmp community ro {community_name}", level: config}
        delete: {command: "no snmp community ro {index}", level: config}

  # SSH has no separate securityName; community name is the join key for
  # community_access lookup chain (#298 Rank1v2). Not a VACM invent.
  snmpcommunitysecurityname:
    sources:
      ssh:
        read: {command: "show snmp community", parser: simple_table, column: 0}
