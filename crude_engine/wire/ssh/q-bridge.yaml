version: "2.6.0"
feature: q-bridge-ssh
description: "SSH CLI sources for VLAN — hand-authored"

attributes:
  dot1qvlanindex:
    sources:
      ssh:
        read: {command: "show vlan brief", parser: table, column: 0}

  dot1qvlanstaticname:
    sources:
      ssh:
        read: {command: "show vlan brief", parser: table, column: 1}

  dot1qpvid:
    sources:
      ssh:
        read: {command: "show vlan port", parser: table, column: 1, key_column: 0}

  dot1qportingressfiltering:
    sources:
      ssh:
        read: {command: "show vlan port", parser: table, column: 3, key_column: 0}

  dot1qportacceptableframetypes:
    type: string
    sources:
      ssh:
        read: {command: "show vlan port", parser: table, column: 2, key_column: 0}


  # get_vlans.ports Rank1 (#290): 1.17 get_vlans uses show vlan port PVID→interfaces
  # (not PortList T/U/F). Table parser is last-wins per key — cannot group multi-iface
  # under one VLAN id from show vlan port alone. Parent-allowed alternate: show vlan id
  # {N} (1.17 get_vlan_egress) → Include + tagging → ports U/T; Exclude → F.
  # iterate_from dot1qvlanindex (brief col0) fans out one show per VLAN.
  # type string: avoid PortList/octet crude on SSH path.
  dot1qvlanstaticegressports:
    type: string
    sources:
      ssh:
        read:
          command: "show vlan id {entity}"
          iterate_from: dot1qvlanindex
          parser: table
          key_column: 0
          column: 3
          filter_column: 1
          filter_value: Include

  dot1qvlanforbiddenegressports:
    type: string
    sources:
      ssh:
        read:
          command: "show vlan id {entity}"
          iterate_from: dot1qvlanindex
          parser: table
          key_column: 0
          column: 0
          filter_column: 2
          filter_value: Exclude

  # MAC address table
  dot1qtpfdbaddress:
    sources:
      ssh:
        read: {command: "show mac-addr-table", parser: table, column: 1}

  dot1qtpfdbport:
    type: string
    sources:
      ssh:
        read: {command: "show mac-addr-table", parser: table, column: 2}

  dot1qfdbid:
    sources:
      ssh:
        read: {command: "show mac-addr-table", parser: table, column: 0}

  dot1qtpfdbstatus:
    type: string
    sources:
      ssh:
        read: {command: "show mac-addr-table", parser: table, column: 4}

  dot1qvlanstaticrowstatus:
    sources:
      ssh:
        create: {command: "vlan add {index}", level: vlan_database}
        delete: {command: "vlan delete {index}", level: vlan_database}
