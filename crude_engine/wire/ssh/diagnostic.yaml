version: "2.9.0"
feature: diagnostic-ssh
description: "SSH CLI sources for HM2-DIAGNOSTIC-MIB"

attributes:
  # Device monitor: show device-status all
  hm2devmonoperstate:
    type: string
    sources:
      ssh:
        read: {command: "show device-status all", field: "Device Monitor"}


  # get_devsec (#323 Rank1): state = hm2devsecoperstate — missing SSH source.
  # 1.17 get_devsec_status + archive: show security-status all field OperState
  # (ok|error). Schema wants noerror|error — existing-tool value_map pattern
  # (sigcon_oper_ssh sibling). Extra show vs monitor: fanout=2, not VLAN-scale
  # (#290/#303 HARD). Prefer existing tools. No invent. No #92.
  hm2devsecoperstate:
    sources:
      ssh:
        read: {command: "show security-status all", field: OperState, tag: value_map, map: devsec_oper_ssh}

  # get_devsec_status (#326 Rank1v2): trap_cause = hm2devsectrapcause.
  # Live tip CLI cell "Trap Cause"..................................secure-boot-disabled
  # (archive + show security-status all). Rank1 bound field but omitted value_map;
  # type:integer → crude_numeric invent 0 ≠ MOPS token. Fix: tag value_map map
  # devsec_cause_cli (archive; quote keys). Same show as oper_state → fanout 1.
  # status_index leftover OK (dict vs int). Prefer existing tools. No invent. No #92.
  hm2devsectrapcause:
    sources:
      ssh:
        read: {command: "show security-status all", field: "Trap Cause", tag: value_map, map: devsec_cause_cli}

  # Security status monitors: show security-status monitor
  hm2devsecsensehttpenabled:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "HTTP server active"}
        write: {command: "security-status monitor http-enabled", level: config}

  hm2devsecsensetelnetenabled:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "Telnet server active"}
        write: {command: "security-status monitor telnet-enabled", level: config}

  hm2devsecsensehidiscoveryenabled:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "Access with HiDiscovery is possible"}
        write: {command: "security-status monitor hidisc-enabled", level: config}

  hm2devsecsensesnmpunsecure:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "SNMP unencrypted"}
        write: {command: "security-status monitor snmp-unsecure", level: config}

  hm2devsecsensesysmonenabled:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "Access to System Monitor possible"}
        write: {command: "security-status monitor sysmon-enabled", level: config}

  hm2devsecsensepasswordchange:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "Password default settings unchanged"}
        write: {command: "security-status monitor pwd-change", level: config}

  hm2devsecsensepasswordminlength:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "Minimum password length less than 8"}
        write: {command: "security-status monitor pwd-min-length", level: config}

  hm2devsecsensepasswordstrengthnotconfigured:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "Password policy settings deactivated"}
        write: {command: "security-status monitor pwd-str-not-config", level: config}

  hm2devsecsensenolinkenabled:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "Link interrupted on enabled device ports"}
        write: {command: "security-status monitor no-link-enabled", level: config}

  hm2devsecsenseextnvmupdateenabled:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "Saving the config on the ENVM possible"}
        write: {command: "security-status monitor extnvm-upd-enabled", level: config}

  hm2devsecsenseextnvmconfigloadunsecure:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "Loading unencrypted configuration from ENVM"}
        write: {command: "security-status monitor extnvm-load-unsecure", level: config}

  hm2devsecsensehttpscertificatewarning:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "Auto generated HTTPS certificate in use"}
        write: {command: "security-status monitor https-cert-warning", level: config}

  hm2devsecsensedevmodeenabled:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "Support Mode is active"}
        write: {command: "security-status monitor support-mode-enabled", level: config}

  hm2devsecsensesecurebootdisabled:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "Secure Boot is inactive"}
        write: {command: "security-status monitor secure-boot-disabled", level: config}

  # get_devsec (#323 Rank1): pml_disabled was write-only — add read from same
  # show security-status monitor as sibling senses. Field from 1.17
  # _DEVSEC_CLI_SENSE + archive. Shape: reuse existing sigcon_sense_ssh
  # (monitored→true, default→false). Fanout stays 1 with other monitors.
  hm2devsecsensepmldisabled:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "PML LLDP Protocol is disabled", tag: value_map, map: sigcon_sense_ssh}
        write: {command: "security-status monitor pml-disabled", level: config}

  hm2devsecsensemodbustcpenabled:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "Modbus TCP/IP server active"}
        write: {command: "security-status monitor modbus-tcp-enabled", level: config}

  hm2devsecsenseethernetipenabled:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "EtherNet/IP protocol active"}
        write: {command: "security-status monitor ethernet-ip-enabled", level: config}

  hm2devsecsenseprofinetioenabled:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "PROFINET protocol active"}
        write: {command: "security-status monitor profinet-io-enabled", level: config}

  hm2devsecsenseiec61850mmsenabled:
    sources:
      ssh:
        read: {command: "show security-status monitor", field: "IEC 61850 MMS is enabled"}
        write: {command: "security-status monitor iec61850-mms-enabled", level: config}

  # get_signal_contact (#293 Rank1): show signal-contact {1|2} all — fanout=2.
  # Prefer archive signal_contact.yaml + napalm-hios 1.17 (ssh_hios get_signal_contact).
  # Dedup: one CLI exec per contact across fields. No invent floors.
  # Left undeclared (no simple 1.17 dot-key / table≠schema-bool): sense_fan_module,
  # sense_module, sense_ps_state (PS table), sense_if_link_alarm (Intf table).
  hm2sigconid:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: "Signal Contact"}

  hm2sigconmode:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: Mode, tag: value_map, map: sigcon_cli_mode}

  hm2sigconoperstate:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: "Operating State (current)", tag: value_map, map: sigcon_oper_ssh}

  hm2sigcontrapenable:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: "Trap Status"}

  hm2sigconsenselinkfailure:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: "Link Failure", tag: value_map, map: sigcon_sense_ssh}

  hm2sigconsensetemperature:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: Temperature, tag: value_map, map: sigcon_sense_ssh}

  hm2sigconsensefan:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: "Fan Failure", tag: value_map, map: sigcon_sense_ssh}

  hm2sigconsensemoduleremoval:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: "Module Removal", tag: value_map, map: sigcon_sense_ssh}

  hm2sigconsenseextnvmremoval:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: "ACA not present", tag: value_map, map: sigcon_sense_ssh}

  hm2sigconsenseextnvmnotinsync:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: "ACA not in sync", tag: value_map, map: sigcon_sense_ssh}

  hm2sigconsenseringredundancy:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: "Ring Redundancy", tag: value_map, map: sigcon_sense_ssh}

  hm2sigconsenseethernetloops:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: "Ethernet Loops", tag: value_map, map: sigcon_sense_ssh}

  hm2sigconsensehumidity:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: Humidity, tag: value_map, map: sigcon_sense_ssh}

  hm2sigconsensestpportblock:
    sources:
      ssh:
        read: {command: "show signal-contact {entity} all", iterate_from: [1, 2], field: "STP Port Block", tag: value_map, map: sigcon_sense_ssh}
