version: "2.9.0"
feature: platform-switching-ssh
description: "SSH CLI sources for platform-switching attrs"

attributes:
  # MTU: show mtu → get_interfaces.mtu (schema wire hm2agentportmaxframesize)
  hm2agentportmaxframesize:
    sources:
      ssh:
        read: {command: "show mtu", parser: paired_rows, lines_per_record: 1, column: 1}
        write: {command: "mtu {value}", level: config_interface}

  # IP Source Guard: show ip source-guard interfaces
  hm2agentipsgifverifysource:
    sources:
      ssh:
        read: {command: "show ip source-guard interfaces", parser: table, column: 1, key_column: 0}

  hm2agentipsgifportsecurity:
    sources:
      ssh:
        read: {command: "show ip source-guard interfaces", parser: table, column: 2, key_column: 0}

  # get_ip_source_guard_bindings (#364 Rank1): no-cli — static binding wires
  # undeclared. CLI.json + 1.17: show ip source-guard bindings static
  # header MAC|IP|Interface|VLAN|Status[+HW]. Columns from unit fixture +
  # ssh_hios.get_ip_source_guard. Prefer static (schema wires are static*).
  # pk = binding_ip = col1. Fanout 1. Prefer existing tools. No invent. No #92.
  hm2agentstaticipsgbindingmacaddr:
    type: string
    sources:
      ssh:
        read: {command: "show ip source-guard bindings static", parser: table, key_column: 1, column: 0}

  hm2agentstaticipsgbindingipaddr:
    type: string
    sources:
      ssh:
        read: {command: "show ip source-guard bindings static", parser: table, key_column: 1, column: 1}

  hm2agentstaticipsgbindingifindex:
    type: string
    sources:
      ssh:
        read: {command: "show ip source-guard bindings static", parser: table, key_column: 1, column: 2}

  hm2agentstaticipsgbindingvlanid:
    sources:
      ssh:
        read: {command: "show ip source-guard bindings static", parser: table, key_column: 1, column: 3}

  hm2agentstaticipsgbindingrowstatus:
    sources:
      ssh:
        read: {command: "show ip source-guard bindings static", parser: table, key_column: 1, column: 4, tag: value_map, map: ipsg_binding_active_ssh}

  hm2agentstaticipsgbindinghwstatus:
    sources:
      ssh:
        read: {command: "show ip source-guard bindings static", parser: table, key_column: 1, column: 5, tag: value_map, map: ipsg_binding_active_ssh}

  # RSTP global: show spanning-tree global
  hm2agentstpadminmode:
    sources:
      ssh:
        read: {command: "show spanning-tree global", field: "Spanning Tree Mode"}
        write: {command: "spanning-tree operation", level: config}

  hm2agentstpcstbridgepriority:
    sources:
      ssh:
        read: {command: "show spanning-tree global", field: "Bridge priority"}
        write: {command: "spanning-tree drstp mst priority 0 {value}", level: config}

  hm2agentstpcstbridgehellotime:
    sources:
      ssh:
        read: {command: "show spanning-tree global", field: "Bridge hello time"}
        write: {command: "spanning-tree drstp hello-time {value}", level: config}

  hm2agentstpcstbridgemaxage:
    sources:
      ssh:
        read: {command: "show spanning-tree global", field: "Bridge max age"}
        write: {command: "spanning-tree drstp max-age {value}", level: config}

  hm2agentstpcstbridgefwddelay:
    sources:
      ssh:
        read: {command: "show spanning-tree global", field: "Bridge forward delay"}
        write: {command: "spanning-tree drstp forward-time {value}", level: config}

  hm2agentstpbpduguardmode:
    sources:
      ssh:
        read: {command: "show spanning-tree global", field: "BPDU-Guard mode"}
        write: {command: "spanning-tree bpdu-guard", level: config}

  # RSTP per-port: show spanning-tree port {port}
  hm2agentstpportstate:
    sources:
      ssh:
        read: {command: "show spanning-tree port {index}", field: "Port mode"}
        write: {command: "spanning-tree mode", level: config_interface}

  hm2agentstpcstportedge:
    sources:
      ssh:
        read: {command: "show spanning-tree port {index}", field: "Edge Port"}
        write: {command: "spanning-tree edge-port", level: config_interface}

  hm2agentstpcstportpriority:
    sources:
      ssh:
        read: {command: "show spanning-tree port {index}", field: "Port priority"}
        write: {command: "spanning-tree priority {value}", level: config_interface}

  hm2agentstpcstportpathcost:
    sources:
      ssh:
        read: {command: "show spanning-tree port {index}", field: "Port path cost"}
        write: {command: "spanning-tree cost {value}", level: config_interface}

  # get_arp_inspection (#315 Rank1): show ip arp-inspection global + vlan + interfaces.
  # Prefer archive arp_inspection.yaml + napalm-hios 1.17 (ssh_hios.get_arp_inspection).
  # Fanout=3 fixed shows — NOT show port; NOT per-VLAN id fanout (#290/#303 HARD).
  # Global: Source/Destination MAC + IP Address Verification.
  # VLAN table (min 5): VLAN Enabled Log BindingCheck ACLStatic [ACLName].
  # Interfaces table (min 5): Interface Trust Auto-Disable RateLimit BurstInterval.
  # Dedup: one CLI exec per show across fields. No invent floors.
  hm2agentdaisrcmacvalidate:
    sources:
      ssh:
        read: {command: "show ip arp-inspection global", field: "Source MAC Verification", tag: value_map, map: dai_global_verify_ssh}
        write: {command: "ip arp-inspection verify src-mac", level: config}

  hm2agentdaidstmacvalidate:
    sources:
      ssh:
        read: {command: "show ip arp-inspection global", field: "Destination MAC Verification", tag: value_map, map: dai_global_verify_ssh}
        write: {command: "ip arp-inspection verify dst-mac", level: config}

  hm2agentdaiipvalidate:
    sources:
      ssh:
        read: {command: "show ip arp-inspection global", field: "IP Address Verification", tag: value_map, map: dai_global_verify_ssh}
        write: {command: "ip arp-inspection verify ip", level: config}

  hm2agentdaivlanindex:
    sources:
      ssh:
        read: {command: "show ip arp-inspection vlan", parser: table, key_column: 0, column: 0}

  hm2agentdaivlandynarpinspenable:
    sources:
      ssh:
        read: {command: "show ip arp-inspection vlan", parser: table, key_column: 0, column: 1, tag: value_map, map: dai_on_ssh}
        write: {command: "ip arp-inspection", level: vlan_config}

  hm2agentdaivlanloggingenable:
    sources:
      ssh:
        read: {command: "show ip arp-inspection vlan", parser: table, key_column: 0, column: 2, tag: value_map, map: dai_on_ssh}

  hm2agentdaivlanbindingcheckenable:
    sources:
      ssh:
        read: {command: "show ip arp-inspection vlan", parser: table, key_column: 0, column: 3, tag: value_map, map: dai_on_ssh}

  hm2agentdaivlanarpaclstaticflag:
    sources:
      ssh:
        read: {command: "show ip arp-inspection vlan", parser: table, key_column: 0, column: 4, tag: value_map, map: dai_on_ssh}

  hm2agentdaivlanarpaclname:
    sources:
      ssh:
        read: {command: "show ip arp-inspection vlan", parser: table, key_column: 0, column: 5}

  hm2agentdaiiftrustenable:
    sources:
      ssh:
        read: {command: "show ip arp-inspection interfaces", parser: table, key_column: 0, column: 1, tag: value_map, map: dai_on_ssh}
        write: {command: "ip arp-inspection trust", level: config_interface}

  hm2agentdaiifautodisable:
    sources:
      ssh:
        read: {command: "show ip arp-inspection interfaces", parser: table, key_column: 0, column: 2, tag: value_map, map: dai_on_ssh}
        write: {command: "ip arp-inspection auto-disable", level: config_interface}

  hm2agentdaiifratelimit:
    sources:
      ssh:
        read: {command: "show ip arp-inspection interfaces", parser: table, key_column: 0, column: 3, tag: value_map, map: dai_rate_limit_ssh}
        write: {command: "ip arp-inspection limit {value}", level: config_interface}

  hm2agentdaiifburstinterval:
    sources:
      ssh:
        read: {command: "show ip arp-inspection interfaces", parser: table, key_column: 0, column: 4, tag: value_map, map: dai_burst_interval_ssh}

  # DHCP Snooping: show ip dhcp-snooping global / interfaces
  hm2agentdhcpsnoopingadminmode:
    sources:
      ssh:
        read: {command: "show ip dhcp-snooping global", field: "DHCP Snooping Mode"}
        write: {command: "ip dhcp-snooping mode", level: config}

  hm2agentdhcpsnoopingverifymac:
    sources:
      ssh:
        read: {command: "show ip dhcp-snooping global", field: "Source MAC Verification"}
        write: {command: "ip dhcp-snooping verify-mac", level: config}

  hm2agentdhcpsnoopingremotefilename:
    type: string
    sources:
      ssh:
        read: {command: "show ip dhcp-snooping global", field: "Bindings Database Location", tag: value_map, map: dhcp_snooping_db_location}
        write: {command: "ip dhcp-snooping database storage {value}", level: config}

  hm2agentdhcpsnoopingiftrustenable:
    sources:
      ssh:
        read: {command: "show ip dhcp-snooping interfaces", parser: table, column: 1}

  # get_loop_protection (#299 Rank1): show loop-protection global + interface — fanout=2.
  # Prefer archive loop_protection.yaml + napalm-hios 1.17 (ssh_hios get_loop_protection).
  # Global: Operational State / Transmit Timeout (sec) / Receive PDU threshold.
  # Interface table (min 7): Intf Admin Mode Action VLAN Loop Last-Timestamp.
  # Dedup: one CLI exec per show across fields. No invent floors. No per-port {index}.
  hm2agentswitchkeepalivestate:
    sources:
      ssh:
        read: {command: "show loop-protection global", field: "Operational State", tag: value_map, map: keepalive_oper_ssh}

  hm2agentswitchkeepalivetransmitinterval:
    sources:
      ssh:
        read: {command: "show loop-protection global", field: "Transmit Timeout (sec)"}

  hm2agentswitchkeepaliverxthreshold:
    sources:
      ssh:
        read: {command: "show loop-protection global", field: "Receive PDU threshold"}

  hm2agentkeepaliveportstate:
    sources:
      ssh:
        read: {command: "show loop-protection interface", parser: table, key_column: 0, column: 1, tag: value_map, map: keepalive_port_admin_ssh}

  hm2agentkeepaliveportmode:
    sources:
      ssh:
        read: {command: "show loop-protection interface", parser: table, key_column: 0, column: 2, tag: value_map, map: keepalive_port_mode_ssh}

  hm2agentkeepaliveportrxaction:
    sources:
      ssh:
        read: {command: "show loop-protection interface", parser: table, key_column: 0, column: 3, tag: value_map, map: keepalive_port_action_ssh}

  hm2agentkeepaliveportvlanid:
    sources:
      ssh:
        read: {command: "show loop-protection interface", parser: table, key_column: 0, column: 4}

  hm2agentkeepaliveportloopdetected:
    sources:
      ssh:
        read: {command: "show loop-protection interface", parser: table, key_column: 0, column: 5, tag: value_map, map: keepalive_loop_detected_ssh}

  hm2agentkeepaliveportlastloopdetectedtime:
    sources:
      ssh:
        read: {command: "show loop-protection interface", parser: table, key_column: 0, column: -1, tag: value_map, map: keepalive_epoch_zero_ssh}

