version: "2.9.0"
feature: platform-qos-cos-ssh
description: "SSH CLI sources for QoS class of service"

attributes:
  # get_qos (#317 Rank1v2): show classofservice trust — fanout=1 (same show).
  # Live tip-test table (dash cols 0-based):
  #   Interface | Port Priority | Trust mode | Untrusted traffic class
  # Rank1 column:1 read Port Priority ('0') — map miss → str '0' ≠ MOPS int 2.
  # Fix: key_column:0, column:2 = Trust mode (CLI 'dot1p' → MIB 2 via value_map).
  # Prefer existing value_map; quote string keys (YAML 1.1 bool-key trap).
  # cpu/1 (n 28 vs 29): no egress key-filter — shape remainder honest.
  # No invent floors. No per-port fanout (#290/#303 HARD).
  hm2agentcosmapintftrustmode:
    type: integer
    sources:
      ssh:
        read: {command: "show classofservice trust", parser: table, key_column: 0, column: 2, tag: value_map, map: cos_trust_mode_ssh}

  hm2agentcosmapuntrustedtrafficclass:
    type: string
    sources:
      ssh:
        read: {command: "show classofservice trust", parser: table, column: 3}
