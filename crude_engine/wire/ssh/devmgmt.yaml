version: "2.9.0"
feature: devmgmt-ssh
description: "SSH CLI sources for HM2-DEVMGMT-MIB"

attributes:
  hm2devmgmtswversion:
    type: string
    sources:
      ssh:
        read: {command: "show system info", field: "Firmware software release (RAM)"}

  hm2devmgmtserialnumber:
    type: string
    sources:
      ssh:
        read: {command: "show system info", field: "Serial number"}

  hm2devmgmtproductdescr:
    type: string
    sources:
      ssh:
        read: {command: "show system info", field: "Device hardware description"}

  hm2devmgmttemperature:
    sources:
      ssh:
        read: {command: "show system info", field: "Current temperature", regex: '(\d+)'}

  hm2devmgmthwversion:
    type: string
    sources:
      ssh:
        read: {command: "show system info", field: "Device hardware revision"}

  hm2devmgmthumidity:
    type: string
    sources:
      ssh:
        read: {command: "show system info", field: "Current humidity"}

  # Software: show system info + show firmware allow-unsigned
  hm2devmgmtswversbootcode:
    type: string
    sources:
      ssh:
        read: {command: "show system info", field: "Bootcode software release (FLASH)"}

  hm2devmgmtswsecurebootadminstatus:
    sources:
      ssh:
        read: {command: "show system info", field: "Secure Boot operational status"}

  hm2devmgmtswsecurebootdevmodestatus:
    sources:
      ssh:
        read: {command: "show system info", field: "Admin state of service shell"}

  hm2devmgmtswversallowunsigned:
    sources:
      ssh:
        read: {command: "show firmware allow-unsigned", field: "Allow unsigned firmware"}
        write: {command: "firmware allow-unsigned {value}", level: config}

  # Interface writes (HM2-DEVMGMT-MIB)
  hm2ifacecablecrossing:
    sources:
      ssh:
        write: {command: "cable-crossing {value}", level: config_interface}

  hm2ifacepowerstate:
    sources:
      ssh:
        write: {command: "power-state", level: config_interface}

  hm2ifaceautopowerdown:
    sources:
      ssh:
        write: {command: "auto-power-down {value}", level: config_interface}

  # get_optics (#55/#274/#294): show sfp is plugged modules, not show port / ifname.
  # Line layout (napalm-hios 1.17): Intf  Part-ID  ModType  Temp  TxPower  RxPower
  # Part-ID is variable width (single spaces); flexible key_column:0 overflows
  # into Part-ID → composite keys "1/1 M-SFP-…". column_overflow:strict clips
  # Intf to dash width so keys match MOPS/SNMP ifName (port id only).
  # Power: left of each dBm/mW pair → dBm float onto *PowerdBm wires (not
  # Integer32 0.1 µW Current{Tx,Rx}Power — that was the #294 scale hole).
  # Value fields still use regex_extract (not column index).
  hm2sfpcurrenttxpowerdbm:
    sources:
      ssh:
        read: {command: "show sfp", parser: paired_rows, lines_per_record: 1, key_column: 0, column_overflow: strict, regex_extract: '(-?\d+\.\d+)\s*/\s*\d+\.\d+', index: 0}

  hm2sfpcurrentrxpowerdbm:
    sources:
      ssh:
        read: {command: "show sfp", parser: paired_rows, lines_per_record: 1, key_column: 0, column_overflow: strict, regex_extract: '(-?\d+\.\d+)\s*/\s*\d+\.\d+', index: 1}

  hm2sfpcurrenttemperature:
    sources:
      ssh:
        read: {command: "show sfp", parser: paired_rows, lines_per_record: 1, key_column: 0, column_overflow: strict, regex_extract: '(\d+)/\d+', index: 1}

  # get_auto_disable (#292 Rank1): show auto-disable brief + reasons — not show port.
  # Prefer archive auto_disable.yaml + napalm-hios 1.17 column layout (2-line records).
  # line0: Intf Reason Remaining Error_time State; line1: Component Reset_timer.
  # Fanout: 2 shows total (brief once + reasons once), no per-port {index}.
  # column_overflow: strict (#292 leftover): flexible key col0 ran into Reason on a
  # single-space gap → composite '1/1 none' keys; strict clips at dash bounds (show sfp sibling).
  hm2autodisableintfoperstate:
    sources:
      ssh:
        read: {command: "show auto-disable brief", parser: paired_rows, lines_per_record: 2, column_overflow: strict, line: 0, column: 4, tag: value_map, map: autodisable_operstate_ssh}

  hm2autodisableintferrorreason:
    sources:
      ssh:
        read: {command: "show auto-disable brief", parser: paired_rows, lines_per_record: 2, column_overflow: strict, line: 0, column: 1, tag: value_map, map: autodisable_reason_cli}

  hm2autodisableintfremainingtime:
    sources:
      ssh:
        read: {command: "show auto-disable brief", parser: paired_rows, lines_per_record: 2, column_overflow: strict, line: 0, column: 2}

  hm2autodisableintftimer:
    sources:
      ssh:
        read: {command: "show auto-disable brief", parser: paired_rows, lines_per_record: 2, column_overflow: strict, line: 1, column: 2}

  # get_auto_disable_reasons — same Rank1 shows pair (CLI_REFERENCE / 1.17).
  hm2autodisablereasons:
    sources:
      ssh:
        read: {command: "show auto-disable reasons", parser: table, key_column: 0, column: 0}

  hm2autodisablereasonoperation:
    sources:
      ssh:
        read: {command: "show auto-disable reasons", parser: table, key_column: 0, column: 1, tag: value_map, map: autodisable_reason_enabled_ssh}

  hm2autodisablereasoncategory:
    sources:
      ssh:
        read: {command: "show auto-disable reasons", parser: table, key_column: 0, column: 0, tag: value_map, map: autodisable_reason_to_category}
