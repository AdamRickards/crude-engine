version: "2.9.0"
feature: ip-forward-ssh
description: "SSH CLI sources for IP routing table (L3 only)"

attributes:
  # show ip route all — table parser
  # Network col is CIDR-suffixed (e.g. 192.168.1.0/24); MOPS/SNMP
  # inetCidrRouteDest is bare InetAddress (pfxLen separate). primary_key
  # destination uses this value as dict key — strip /prefix via existing
  # regex tool (SSH gather applies regex per-value). Prefer existing tools.
  # Fanout stays 1 (same show). No invent. No #92.
  inetcidrroutedest:
    type: string
    sources:
      ssh:
        read: {command: "show ip route all", parser: table, column: 0, regex: '^([^/]+)'}

  inetcidrrouteproto:
    type: string
    sources:
      ssh:
        read: {command: "show ip route all", parser: table, column: 1}

  inetcidrroutenexthop:
    type: string
    sources:
      ssh:
        read: {command: "show ip route all", parser: table, column: 2}

  inetcidrrouteifindex:
    type: string
    sources:
      ssh:
        read: {command: "show ip route all", parser: table, column: 3}

  inetcidrroutemetric1:
    sources:
      ssh:
        read: {command: "show ip route all", parser: table, column: 4}

  # age not available in SSH output
