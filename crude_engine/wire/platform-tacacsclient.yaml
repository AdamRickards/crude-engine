    syntax: INTEGER
    type: integer
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.248.12.18.1.249.1
          method: get
      mops:
        read:
          mib: HM2-PLATFORM-TACACSCLIENT-MIB
          table: hm2AgentTacacsAccountingGroup
          field: hm2AgentTacacsCmdAccountingMode
  hm2agenttacacscmdauthorizationadminstatus:
