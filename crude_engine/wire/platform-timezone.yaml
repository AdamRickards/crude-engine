      hm2agenttimezoneacronym: ''
      hm2agenttimezonehoursoffset: 0
      hm2agenttimezoneminutesoffset: 0
attributes:
  hm2agentstrecurringendingday:
    syntax: INTEGER
    type: integer
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.248.12.42.3.2.6
          method: get
      mops:
        read:
          mib: HM2-PLATFORM-TIMEZONE-MIB
          table: hm2AgentSummerTimeRecurringGroup
          field: hm2AgentStRecurringEndingDay
    validation:
      allowed:
      - none
      - sun
      - mon
      - tue
      - wed
      - thu
      - fri
      - sat
  hm2agentstrecurringendingmonth:
    syntax: INTEGER
