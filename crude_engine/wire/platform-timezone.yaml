    defaults:
      hm2agentstrecurringendingday: 0
      hm2agentstrecurringendingmonth: 0
      hm2agentstrecurringendingtime: ''
      hm2agentstrecurringendingweek: 0
      hm2agentstrecurringstartingday: 0
      hm2agentstrecurringstartingmonth: 0
      hm2agentstrecurringstartingtime: ''
      hm2agentstrecurringstartingweek: 0
      hm2agentstrecurringzoneacronym: ''
      hm2agentstrecurringzoneoffset: 0
      hm2agentsummertimemode: 0
