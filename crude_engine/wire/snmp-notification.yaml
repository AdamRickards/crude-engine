    defaults:
      snmpnotifyentry: ''
      snmpnotifyfilterentry: ''
      snmpnotifyfiltermask: ''
      snmpnotifyfilterprofileentry: ''
      snmpnotifyfilterprofilename: ''
      snmpnotifyfilterprofilerowstatus: 0
      snmpnotifyfilterprofilestortype: 0
      snmpnotifyfilterprofiletable: ''
      snmpnotifyfilterrowstatus: 0
      snmpnotifyfilterstoragetype: 0
      snmpnotifyfiltersubtree: ''
      snmpnotifyfiltertable: ''
      snmpnotifyfiltertype: 0
      snmpnotifyname: ''
      snmpnotifyrowstatus: 0
      snmpnotifystoragetype: 0
      snmpnotifytable: ''
      snmpnotifytag: ''
      snmpnotifytype: 0
attributes:
  snmpnotifyentry:
    syntax: SnmpNotifyEntry
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.6.3.13.1.1.1
          method: get
      mops:
        read:
          mib: SNMP-NOTIFICATION-MIB
          table: snmpNotifyTable
          field: snmpNotifyEntry
  snmpnotifyfilterentry:
    syntax: SnmpNotifyFilterEntry
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.6.3.13.1.3.1
          method: get
      mops:
        read:
          mib: SNMP-NOTIFICATION-MIB
          table: snmpNotifyFilterTable
          field: snmpNotifyFilterEntry
  snmpnotifyfiltermask:
    syntax: OCTET STRING
    type: string
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.6.3.13.1.3.1.2
          method: walk
      mops:
        read:
          mib: SNMP-NOTIFICATION-MIB
          table: snmpNotifyFilterEntry
          field: snmpNotifyFilterMask
          index_field: snmpNotifyFilterSubtree
          index_fields: &id001
          - snmpNotifyFilterProfileName
          - snmpNotifyFilterSubtree
          key_tag: to_hex_decode
    validation:
      min: 0
      max: 16
  snmpnotifyfilterprofileentry:
