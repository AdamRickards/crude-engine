          method: walk
      mops:
        read:
          mib: SNMP-NOTIFICATION-MIB
          table: snmpNotifyFilterProfileEntry
          field: snmpNotifyFilterProfileName
          index_field: snmpTargetParamsName
          key_tag: to_hex_decode
    validation:
      min: 1
      max: 32
  snmpnotifyfilterprofilerowstatus:
    syntax: RowStatus
    type: integer
    access: crud
