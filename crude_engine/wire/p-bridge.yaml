        read:
          oid: 1.3.6.1.2.1.17.6.1.1.4.1.1
          method: walk
      mops:
        read:
          mib: P-BRIDGE-MIB
          table: dot1dPortCapabilitiesEntry
          field: dot1dPortCapabilities
