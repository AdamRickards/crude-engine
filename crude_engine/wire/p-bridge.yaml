attributes:
  dot1ddevicecapabilities:
    syntax: BITS
    type: list
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.2.1.17.6.1.1.1
          method: get
      mops:
        read:
          mib: P-BRIDGE-MIB
          table: dot1dExtBase
          field: dot1dDeviceCapabilities
    bit_map:
      0: dot1dExtendedFilteringServices
      1: dot1dTrafficClasses
      2: dot1qStaticEntryIndividualPort
      3: dot1qIVLCapable
      4: dot1qSVLCapable
      5: dot1qHybridCapable
      6: dot1qConfigurablePvidTagging
      7: dot1dLocalVlanCapable
  dot1dgmrpstatus:
