attributes:
  hm2agentarpaclentry:
    syntax: Hm2AgentArpAclEntry
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.248.12.1.2.8.22.1.1
          method: get
      mops:
        read:
          mib: HM2-PLATFORM-SWITCHING-MIB
          table: hm2AgentArpAclTable
          field: hm2AgentArpAclEntry
  hm2agentarpaclname:
    syntax: DisplayString
    type: string
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.248.12.1.2.8.22.1.1.1
          method: walk
      mops:
        read:
          mib: HM2-PLATFORM-SWITCHING-MIB
          table: hm2AgentArpAclEntry
          field: hm2AgentArpAclName
          index_field: hm2AgentArpAclName
    validation:
      min: 1
      max: 31
  hm2agentarpaclrowstatus:
    syntax: RowStatus
    type: integer
    access: crud
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.248.12.1.2.8.22.1.1.2
          method: walk
      mops:
        read:
          mib: HM2-PLATFORM-SWITCHING-MIB
          table: hm2AgentArpAclEntry
          field: hm2AgentArpAclRowStatus
          index_field: hm2AgentArpAclName
    create_method: createAndWait
  hm2agentarpaclruleentry:
    syntax: Hm2AgentArpAclRuleEntry
    type: string
    access: r
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.248.12.1.2.8.22.2.1
          method: get
      mops:
        read:
          mib: HM2-PLATFORM-SWITCHING-MIB
          table: hm2AgentArpAclRuleTable
          field: hm2AgentArpAclRuleEntry
  hm2agentarpaclrulematchsenderipaddr:
    syntax: IpAddress
    type: string
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.248.12.1.2.8.22.2.1.1
          method: walk
      mops:
        read:
          mib: HM2-PLATFORM-SWITCHING-MIB
          table: hm2AgentArpAclRuleEntry
          field: hm2AgentArpAclRuleMatchSenderIpAddr
          index_field: hm2AgentArpAclRuleMatchSenderMacAddr
          index_fields: &id001
          - hm2AgentArpAclName
          - hm2AgentArpAclRuleMatchSenderIpAddr
          - hm2AgentArpAclRuleMatchSenderMacAddr
  hm2agentarpaclrulematchsendermacaddr:
    syntax: MacAddress
    type: string
    access: ru
    sources:
      snmp:
        read:
          oid: 1.3.6.1.4.1.248.12.1.2.8.22.2.1.2
          method: walk
      mops:
        read:
          mib: HM2-PLATFORM-SWITCHING-MIB
          table: hm2AgentArpAclRuleEntry
          field: hm2AgentArpAclRuleMatchSenderMacAddr
          index_field: hm2AgentArpAclRuleMatchSenderMacAddr
