# inspect.yaml — harness inspect budgets. TEST infrastructure, not engine
# schemas. crude_engine does not read this file. tests/release_matrix.py
# ::run_inspect and the sidecar (which calls it) do.
#
# YAML declares per-protocol open_timeout_s and call_timeout_s. Python
# only interprets. Do not hardcode seconds in release_matrix.py.
# Combined wall time is not a failure signal. A protocol that opens and
# calls inside these two budgets is status: ok.
#
# Starting budgets from live get_dns (home-office). Tune here, not in Python.
# MOPS open is two TLS handshakes (~1.5s), not a bug. SNMP call needs
# headroom for sub_table + per-OID fallback. SSH open is prompt/login.

protocols:
  mops:
    open_timeout_s: 3
    call_timeout_s: 2
  snmp:
    open_timeout_s: 2
    call_timeout_s: 4
  ssh:
    open_timeout_s: 6
    call_timeout_s: 3
