# inspect.yaml — harness inspect budgets. TEST infrastructure, not engine
# schemas. crude_engine does not read this file. tests/release_matrix.py
# ::run_inspect and the sidecar (which calls it) do.
#
# YAML declares per-protocol open_timeout_s and call_timeout_s. Python
# only interprets. Do not hardcode seconds in release_matrix.py.
# Combined wall time is not a failure signal. A protocol that opens and
# calls inside these two budgets is status: ok.
#
# Phase attribution (#179): timeouts report phase=open or phase=call.
# Real phase timeouts are honest feedback — tune values here.
#
# 2026-09-13 headroom (post-#179 live SSH timeout-cluster retest + #92 note):
# SSH open measured ~6.0–6.4s vs old 6s; several SSH/MOPS/SNMP calls
# 4–5s+ vs old call budgets. Bump for headroom; do not mask hangs
# (attribution still names the phase). Fail-fast on invalid CLI is separate.

protocols:
  mops:
    open_timeout_s: 4
    call_timeout_s: 6
  snmp:
    open_timeout_s: 3
    call_timeout_s: 8
  ssh:
    open_timeout_s: 8
    call_timeout_s: 6
