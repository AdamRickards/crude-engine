<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 780" width="920" height="780" role="img" aria-labelledby="title desc">
  <title id="title">The three-gate model</title>
  <desc id="desc">Ingress write/set and egress read/get through Gate 1 Schema Contract, Gate 2 Wire Contract, and Gate 3 Encode/Decode plus dispatch. No gate transit, no context, no operation.</desc>
  <style>
    .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e8ecf4; }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 12px; fill: #8b93a7; }
    .box-title { font-size: 13px; font-weight: 650; }
    .box-sub { font-size: 11px; fill: #8b93a7; }
    .lbl { font-size: 10px; fill: #5b9dff; }
    .col { font-size: 12px; font-weight: 650; letter-spacing: 0.08em; fill: #8b93a7; }
    .legend { font-size: 11px; fill: #8b93a7; }
    .small { font-size: 10px; fill: #8b93a7; }
    .mono { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 11px; fill: #e8ecf4; }
    .mono-m { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10px; fill: #8b93a7; }
  </style>
  <rect width="920" height="780" fill="#0b0d12"/>
  <text class="t title" x="460" y="32" text-anchor="middle">The three-gate model</text>
  <text class="t sub" x="460" y="52" text-anchor="middle">No gate transit, no context, no operation.</text>
  <text class="t col" x="220" y="80" text-anchor="middle">INGRESS  (write / set)</text>
  <text class="t col" x="700" y="80" text-anchor="middle">EGRESS  (read / get)</text>
  <rect x="30" y="96" width="380" height="56" rx="8" fill="#3a4150" stroke="#2a3142" stroke-width="1"/>
  <text class="t box-title" x="220.0" y="118" text-anchor="middle">Adapter</text>
  <text class="t box-sub" x="220.0" y="136" text-anchor="middle">verbs and kwargs  ·  hios.py (consumer)</text>
  <rect x="30" y="174" width="380" height="56" rx="8" fill="#0f5c52" stroke="#2a3142" stroke-width="1"/>
  <text class="t box-title" x="220.0" y="196" text-anchor="middle">Gate 1 — schema contract</text>
  <text class="t box-sub" x="220.0" y="214" text-anchor="middle">validates kwargs, produces SchemaContext</text>
  <rect x="30" y="252" width="380" height="56" rx="8" fill="#4a3a7a" stroke="#2a3142" stroke-width="1"/>
  <text class="t box-title" x="220.0" y="274" text-anchor="middle">Engine pipeline</text>
  <text class="t box-sub" x="220.0" y="292" text-anchor="middle">_translate: value_map, key_map, collect, regex</text>
  <rect x="30" y="330" width="380" height="56" rx="8" fill="#a84b1a" stroke="#2a3142" stroke-width="1"/>
  <text class="t box-title" x="220.0" y="352" text-anchor="middle">Gate 2 — wire contract</text>
  <text class="t box-sub" x="220.0" y="370" text-anchor="middle">sole wire accessor, access check, WireContext</text>
  <rect x="30" y="408" width="380" height="56" rx="8" fill="#8b2e2e" stroke="#2a3142" stroke-width="1"/>
  <text class="t box-title" x="220.0" y="430" text-anchor="middle">Gate 3 — encode + dispatch</text>
  <text class="t box-sub" x="220.0" y="448" text-anchor="middle">CRUDE encode, dispatch_batch  ·  groups (mib, table)</text>
  <rect x="30" y="486" width="380" height="56" rx="8" fill="#3a4150" stroke="#2a3142" stroke-width="1"/>
  <text class="t box-title" x="220.0" y="508" text-anchor="middle">Transport (dumb I/O)</text>
  <text class="t box-sub" x="220.0" y="526" text-anchor="middle">MOPS / SNMP / SSH / Offline</text>
  <rect x="510" y="96" width="380" height="56" rx="8" fill="#3a4150" stroke="#2a3142" stroke-width="1"/>
  <text class="t box-title" x="700.0" y="118" text-anchor="middle">Adapter</text>
  <text class="t box-sub" x="700.0" y="136" text-anchor="middle">canonical output  ·  consumer reshape lives here</text>
  <rect x="510" y="174" width="380" height="56" rx="8" fill="#0f5c52" stroke="#2a3142" stroke-width="1"/>
  <text class="t box-title" x="700.0" y="196" text-anchor="middle">Gate 1 — schema contract</text>
  <text class="t box-sub" x="700.0" y="214" text-anchor="middle">output matches defaults contract</text>
  <rect x="510" y="252" width="380" height="56" rx="8" fill="#4a3a7a" stroke="#2a3142" stroke-width="1"/>
  <text class="t box-title" x="700.0" y="274" text-anchor="middle">Engine pipeline</text>
  <text class="t box-sub" x="700.0" y="292" text-anchor="middle">_translate: value_map, compute, lookup, shape</text>
  <rect x="510" y="330" width="380" height="56" rx="8" fill="#a84b1a" stroke="#2a3142" stroke-width="1"/>
  <text class="t box-title" x="700.0" y="352" text-anchor="middle">Gate 2 — wire contract</text>
  <text class="t box-sub" x="700.0" y="370" text-anchor="middle">resolves wire (validate=false), WireContext</text>
  <rect x="510" y="408" width="380" height="56" rx="8" fill="#8b2e2e" stroke="#2a3142" stroke-width="1"/>
  <text class="t box-title" x="700.0" y="430" text-anchor="middle">Gate 3 — gather + decode</text>
  <text class="t box-sub" x="700.0" y="448" text-anchor="middle">gather_and_decode, CRUDE decode</text>
  <rect x="510" y="486" width="380" height="56" rx="8" fill="#3a4150" stroke="#2a3142" stroke-width="1"/>
  <text class="t box-title" x="700.0" y="508" text-anchor="middle">Transport (dumb I/O)</text>
  <text class="t box-sub" x="700.0" y="526" text-anchor="middle">MOPS / SNMP / SSH / Offline</text>
  <line x1="220.0" y1="152" x2="220.0" y2="168" stroke="#e8ecf4" stroke-width="1.4"/>
  <polygon points="215.0,166 225.0,166 220.0,174" fill="#e8ecf4"/>
  <text class="t lbl" x="232.0" y="166.0">ResolvedIntent</text>
  <line x1="220.0" y1="230" x2="220.0" y2="246" stroke="#e8ecf4" stroke-width="1.4"/>
  <polygon points="215.0,244 225.0,244 220.0,252" fill="#e8ecf4"/>
  <text class="t lbl" x="232.0" y="244.0">SchemaContext</text>
  <line x1="220.0" y1="308" x2="220.0" y2="324" stroke="#e8ecf4" stroke-width="1.4"/>
  <polygon points="215.0,322 225.0,322 220.0,330" fill="#e8ecf4"/>
  <text class="t lbl" x="232.0" y="322.0">translated values</text>
  <line x1="220.0" y1="386" x2="220.0" y2="402" stroke="#e8ecf4" stroke-width="1.4"/>
  <polygon points="215.0,400 225.0,400 220.0,408" fill="#e8ecf4"/>
  <text class="t lbl" x="232.0" y="400.0">WireContext</text>
  <line x1="220.0" y1="464" x2="220.0" y2="480" stroke="#e8ecf4" stroke-width="1.4"/>
  <polygon points="215.0,478 225.0,478 220.0,486" fill="#e8ecf4"/>
  <text class="t lbl" x="232.0" y="478.0">encoded values</text>
  <line x1="700.0" y1="174" x2="700.0" y2="158" stroke="#e8ecf4" stroke-width="1.4"/>
  <polygon points="695.0,160 705.0,160 700.0,152" fill="#e8ecf4"/>
  <text class="t lbl" x="712.0" y="166.0">validated result</text>
  <line x1="700.0" y1="252" x2="700.0" y2="236" stroke="#e8ecf4" stroke-width="1.4"/>
  <polygon points="695.0,238 705.0,238 700.0,230" fill="#e8ecf4"/>
  <text class="t lbl" x="712.0" y="244.0">shaped result</text>
  <line x1="700.0" y1="330" x2="700.0" y2="314" stroke="#e8ecf4" stroke-width="1.4"/>
  <polygon points="695.0,316 705.0,316 700.0,308" fill="#e8ecf4"/>
  <text class="t lbl" x="712.0" y="322.0">decoded data</text>
  <line x1="700.0" y1="408" x2="700.0" y2="392" stroke="#e8ecf4" stroke-width="1.4"/>
  <polygon points="695.0,394 705.0,394 700.0,386" fill="#e8ecf4"/>
  <text class="t lbl" x="712.0" y="400.0">WireContext</text>
  <line x1="700.0" y1="486" x2="700.0" y2="470" stroke="#e8ecf4" stroke-width="1.4"/>
  <polygon points="695.0,472 705.0,472 700.0,464" fill="#e8ecf4"/>
  <text class="t lbl" x="712.0" y="478.0">raw device data</text>
  <rect x="30" y="568" width="860" height="52" rx="26" fill="#2a3142" stroke="#8b93a7" stroke-width="1"/>
  <text class="t box-title" x="460" y="590" text-anchor="middle">Physical device</text>
  <text class="t box-sub" x="460" y="608" text-anchor="middle">wire YAML is device truth  ·  SNMP audit log + canonical read-back</text>
  <line x1="220.0" y1="542" x2="220.0" y2="562" stroke="#e8ecf4" stroke-width="1.4"/>
  <polygon points="215.0,560 225.0,560 220.0,568" fill="#e8ecf4"/>
  <text class="t lbl" x="232.0" y="558.0">protocol I/O</text>
  <line x1="700.0" y1="568" x2="700.0" y2="548" stroke="#e8ecf4" stroke-width="1.4"/>
  <polygon points="695.0,550 705.0,550 700.0,542" fill="#e8ecf4"/>
  <text class="t lbl" x="712.0" y="558.0">raw values</text>
  <text class="t col" x="30" y="648">CONTEXT OWNERSHIP</text>
  <rect x="30" y="664" width="16" height="16" rx="3" fill="#0f5c52"/>
  <text class="t legend" x="54" y="677">Gate 1  produces SchemaContext</text>
  <rect x="470" y="664" width="16" height="16" rx="3" fill="#a84b1a"/>
  <text class="t legend" x="494" y="677">Gate 2  produces WireContext</text>
  <rect x="30" y="692" width="16" height="16" rx="3" fill="#8b2e2e"/>
  <text class="t legend" x="54" y="705">Gate 3  encode/decode + dispatch</text>
  <rect x="470" y="692" width="16" height="16" rx="3" fill="#4a3a7a"/>
  <text class="t legend" x="494" y="705">Pipeline  schema transforms only</text>
  <text class="t sub" x="460" y="740" text-anchor="middle">Each gate validates and returns context. Without gate output, the next layer cannot operate.</text>
</svg>
